name: Deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Existing tag to roll to (blank = build this commit). Use this to roll back.'
        required: false
        type: string
      skipMigration:
        description: 'Skip the DbUp job. Only when you know no script was added.'
        required: false
        default: false
        type: boolean

# Never let two deploys touch the environment at once, and never cancel one midway:
# an interrupted deploy can leave the schema ahead of the running API.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  POSTGRES_SKU: ${{ vars.POSTGRES_SKU }}
  POSTGRES_TIER: ${{ vars.POSTGRES_TIER }}
  POSTGRES_VERSION: ${{ vars.POSTGRES_VERSION }}
  # Everything the parameter file reads. Shared by both deployment jobs.
  AZURE_TENANT_ID: ${{ vars.APP_AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ vars.APP_AZURE_CLIENT_ID }}
  AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
  AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
  AZURE_AI_SEARCH_ENDPOINT: ${{ vars.AZURE_AI_SEARCH_ENDPOINT }}
  AZURE_AI_SEARCH_INDEX: ${{ vars.AZURE_AI_SEARCH_INDEX }}
  POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  AZURE_AI_SEARCH_API_KEY: ${{ secrets.AZURE_AI_SEARCH_API_KEY }}
  COSMOS_CONNECTION_STRING: ${{ secrets.COSMOS_CONNECTION_STRING }}

jobs:
  # Runs first so the registry exists before anything tries to push to it. This is also what
  # makes the very first run work on an empty resource group, with no manual deploy beforehand.
  infra:
    name: Infrastructure
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.deploy.outputs.registry }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          TAG="${{ inputs.imageTag }}"
          [ -n "$TAG" ] || TAG=$(git rev-parse --short HEAD)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag $TAG"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check the resource group
        run: |
          az group show -n "$RESOURCE_GROUP" -o none 2>/dev/null || {
            echo "::error::Resource group '$RESOURCE_GROUP' does not exist, or the deployer cannot see it."
            echo "The group is created once during bootstrap, because a role assignment needs it as a scope."
            exit 1
          }

      # A missing provider surfaces as a Conflict nested three levels inside the ARM error,
      # which reads like a template bug. Name it up front instead. Registration is a
      # subscription-scope operation, so the deployer cannot fix it itself.
      - name: Check resource providers
        run: |
          MISSING=""
          UNREADABLE=""
          for ns in Microsoft.App Microsoft.ContainerRegistry Microsoft.DBforPostgreSQL                     Microsoft.ServiceBus Microsoft.Communication Microsoft.KeyVault                     Microsoft.OperationalInsights Microsoft.Insights                     Microsoft.ManagedIdentity Microsoft.Storage; do
            STATE=$(az provider show -n "$ns" --query registrationState -o tsv 2>/dev/null || echo Unreadable)
            case "$STATE" in
              Registered)  ;;
              Unreadable)  UNREADABLE="$UNREADABLE $ns" ;;
              *)           MISSING="$MISSING $ns($STATE)" ;;
            esac
          done

          if [ -n "$UNREADABLE" ]; then
            echo "::warning::Could not read provider state for:$UNREADABLE (the deployer has no subscription-scope read). Skipping the check for those."
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::Resource providers not registered:$MISSING"
            echo "Register them once from an account with subscription-scope rights, then re-run:"
            echo "  az account set --subscription <id>"
            echo "  az provider register --namespace <name> --wait"
            exit 1
          fi
          echo "Provider check passed."

      # Infrastructure only. Neither the apps nor the migration job can be created yet: Container
      # Apps validates the image reference, and nothing has been pushed to the registry at this point.
      - id: deploy
        name: Deploy infrastructure
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          DEPLOY_APPS: 'false'
          DEPLOY_JOB: 'false'
        run: |
          az bicep install
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "infra-${IMAGE_TAG}-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.dev.bicepparam \
            --only-show-errors \
            --query properties.outputs -o json > infra-outputs.json

          REGISTRY=$(jq -r .registryName.value infra-outputs.json)
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

          {
            echo "### Infrastructure"
            echo ""
            echo "- registry: \`$REGISTRY\`"
            echo "- frontend: $(jq -r .frontendUrl.value infra-outputs.json)"
            echo "- api: $(jq -r .apiUrl.value infra-outputs.json)"
            echo "- SPA redirect URI: \`$(jq -r .spaRedirectUri.value infra-outputs.json)\`"
            echo "- Stripe webhook: \`$(jq -r .stripeWebhookUrl.value infra-outputs.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Images
    needs: infra
    runs-on: ubuntu-latest
    # Skipped when rolling back to a tag already in the registry.
    if: ${{ inputs.imageTag == '' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: src/Backend/Presentation/Dockerfile
          - name: frontend
            dockerfile: src/Frontend/WebApp/Dockerfile
          - name: functions
            dockerfile: src/Microservices/TaskTracker.Functions/Dockerfile
          - name: migration
            dockerfile: src/Backend/Database/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login --name "${{ needs.infra.outputs.registry }}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ needs.infra.outputs.registry }}.azurecr.io/tasktracker-${{ matrix.name }}:${{ needs.infra.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: Migrate and release
    needs: [infra, images]
    # Runs when `images` was skipped for a rollback, but not when it actually failed.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      IMAGE_TAG: ${{ needs.infra.outputs.tag }}
      REGISTRY: ${{ needs.infra.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare CLI
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az extension add --name containerapp --upgrade --only-show-errors
          az bicep install

      - name: Confirm all four images exist
        run: |
          for img in api frontend functions migration; do
            az acr repository show-tags --name "$REGISTRY" --repository "tasktracker-$img" \
              --query "contains(@, '$IMAGE_TAG')" -o tsv 2>/dev/null | grep -qi true \
              || { echo "::error::tasktracker-$img:$IMAGE_TAG is not in the registry"; exit 1; }
          done
          echo "All four images present at $IMAGE_TAG."

      # Container Apps validates the image when the job is created, so this cannot happen
      # until the images job has pushed. Apps stay on their old image until the step after next.
      - name: Create the migration job
        env:
          DEPLOY_APPS: 'false'
          DEPLOY_JOB: 'true'
        run: |
          az deployment group create             --resource-group "$RESOURCE_GROUP"             --name "job-${IMAGE_TAG}-${{ github.run_number }}"             --template-file infra/main.bicep             --parameters infra/main.dev.bicepparam             --only-show-errors -o none

      - name: Apply the schema
        if: ${{ inputs.skipMigration != true }}
        run: |
          JOB="job-migrate-dev"
          EXEC=$(az containerapp job start -g "$RESOURCE_GROUP" -n "$JOB" --query name -o tsv)
          echo "Started $EXEC"

          for attempt in $(seq 1 90); do
            STATUS=$(az containerapp job execution show \
              -g "$RESOURCE_GROUP" -n "$JOB" --job-execution-name "$EXEC" \
              --query properties.status -o tsv 2>/dev/null || echo Unknown)
            case "$STATUS" in
              Succeeded)
                echo "Migration succeeded."
                exit 0
                ;;
              Failed|Degraded|Stopped)
                echo "::error::Migration $STATUS. Logs follow."
                az containerapp job logs show -g "$RESOURCE_GROUP" -n "$JOB" \
                  --execution "$EXEC" --container migrate --tail 200 || true
                exit 1
                ;;
              *)
                echo "  [$attempt/90] $STATUS"
                sleep 10
                ;;
            esac
          done

          echo "::error::Migration did not finish within 15 minutes."
          exit 1

      # Only now do the apps move onto the new image, against a schema already in place.
      - name: Release the apps
        env:
          DEPLOY_APPS: 'true'
          DEPLOY_JOB: 'true'
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "apps-${IMAGE_TAG}-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.dev.bicepparam \
            --only-show-errors \
            --query properties.outputs -o json > outputs.json

      - name: Smoke check
        run: |
          FRONTEND=$(jq -r .frontendUrl.value outputs.json)
          API=$(jq -r .apiUrl.value outputs.json)

          CODE=000
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$FRONTEND" || echo 000)
            [ "$CODE" = "200" ] && break
            echo "  frontend [$i/20] HTTP $CODE"
            sleep 15
          done
          [ "$CODE" = "200" ] || { echo "::error::Frontend returned $CODE"; exit 1; }

          # 401 is a pass: the API is up and refusing an unauthenticated call.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$API/api/workspaces" || echo 000)
          case "$CODE" in
            200|401|403) echo "API reachable (HTTP $CODE)" ;;
            *) echo "::error::API returned $CODE"; exit 1 ;;
          esac

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | $IMAGE_TAG |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Migration | ${{ inputs.skipMigration == true && 'skipped' || 'applied' }} |"
            if [ -f outputs.json ]; then
              echo "| Frontend | $(jq -r .frontendUrl.value outputs.json) |"
              echo "| API | $(jq -r .apiUrl.value outputs.json) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
