<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Task Tracker</title>
    <base href="/"/>
    <link rel="preload" id="webassembly"/>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="css/app.css"/>
    <link rel="icon" type="image/png" href="favicon.png"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet"/>
    <link href="WebApp.styles.css" rel="stylesheet" />
    <script type="importmap"></script>

    <style>
        :root {
            --background-color: #FFFFFF;
            --text-color: #1A1D1F;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color) !important;
            color: var(--text-color) !important;
            transition: background-color 0.2s;
        }

        .app-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #5C58D6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        .dark-mode .spinner {
            border-color: rgba(255, 255, 255, 0.1);
            border-left-color: #6C63FF;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

<script>
    window.updateBodyTheme = function (isDark) {
        if (isDark) {
            document.documentElement.style.setProperty('--background-color', '#181A20');
            document.documentElement.style.setProperty('--text-color', '#FFFFFF');
            document.body.classList.add('dark-mode');
        } else {
            document.documentElement.style.setProperty('--background-color', '#F9FAFB');
            document.documentElement.style.setProperty('--text-color', '#1A1D1F');
            document.body.classList.remove('dark-mode');
        }
    };

    (function () {
        let theme = localStorage.getItem('themePreference');
        let isDark = (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches));
        window.updateBodyTheme(isDark);
    })();
</script>

<div id="app">
    <div class="app-loader">
        <div class="spinner"></div>
        <div style="font-weight: 500; margin-top: 16px;">Loading TaskTracker...</div>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="" class="reload">Reload</a>
    <a class="dismiss">🗙</a>
</div>

<script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
<script src="_content/MudBlazor/MudBlazor.min.js"></script>
<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
