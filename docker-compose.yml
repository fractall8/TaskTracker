services:
  postgres-db:
    image: postgres:17-alpine
    container_name: tasktracker-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  db-migration:
    image: tasktracker-migration
    container_name: tasktracker-migration
    build:
      context: .
      dockerfile: ./src/Backend/Database/Dockerfile
    environment:
      - ConnectionStrings__PostgresConnection=Host=postgres-db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      postgres-db:
        condition: service_healthy
  
  api:
    image: tasktracker-api
    container_name: tasktracker-api
    build:
      context: .
      dockerfile: ./src/Backend/Presentation/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgresConnection=Host=postgres-db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ConnectionStrings__AzureBlobStorage=${AZURITE_CONNECTION_STRING}
      - AzureAd__TenantId=${AZURE_TENANT_ID}
      - AzureAd__ClientId=${AZURE_CLIENT_ID}
      - AzureAd__Audience=api://${AZURE_CLIENT_ID}
    depends_on:
      - postgres-db
      - azurite
    develop:
      watch:
        - action: rebuild
          path: ./src/Backend/Presentation
          ignore:
            - bin/
            - obj/
        - action: rebuild
          path: ./src/Shared/Contracts
          ignore:
            - bin/
            - obj/
    
  frontend:
    image: tasktracker-frontend
    container_name: tasktracker-frontend
    build:
      context: .
      dockerfile: src/Frontend/WebApp/Dockerfile
    ports:
      - "3000:80"
    environment:
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - API_CLIENT_SCOPES=api://${AZURE_CLIENT_ID}/access_as_user
    depends_on:
      - api
    develop:
      watch:
        - action: rebuild
          path: ./src/Frontend/WebApp
          ignore:
            - bin/
            - obj/
        - action: rebuild
          path: ./src/Shared/Contracts
          ignore:
            - bin/
            - obj/
      
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    ports:
      - "10000:10000"
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck"
    volumes:
      - azurite-data:/data

volumes:
  postgres-data:
    name: tasktracker-postgres-data
  azurite-data:
    name: tasktracker-azurite-data