services:
  postgres-db:
    image: postgres:17-alpine
    container_name: tasktracker-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  db-migration:
    image: tasktracker-migration
    container_name: tasktracker-migration
    build:
      context: .
      dockerfile: ./Database/Dockerfile
    environment:
      - ConnectionStrings__PostgresConnection=Host=postgres-db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};
    depends_on:
      postgres-db:
        condition: service_healthy
  
  api:
    image: tasktracker-api
    container_name: tasktracker-api
    build:
      context: .
      dockerfile: ./Presentation/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgresConnection=Host=postgres-db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};
    depends_on:
      - postgres-db

volumes:
  postgres-data:
    name: tasktracker-postgres-data